name: EduLogic

on:
  push:
    paths:
      - 'simulator/**'
      - '.github/workflows/edulogic.yml'
  pull_request:
    paths:
      - 'simulator/**'
      - '.github/workflows/edulogic.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: EduLogic reference-model tests
        working-directory: simulator
        run: make test

  hdl:
    uses: Ploos-AS/hardware-ci/.github/workflows/hdl.yml@main
    with:
      working_directory: simulator
      test_command: "make hdl-test"
      verilog_files: "examples/half-adder.v"
      top: half_adder
      conformance_command: "make hdl-conformance"
