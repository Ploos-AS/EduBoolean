name: EduLogic

on:
  push:
    paths:
      - 'simulator/**'
      - '.github/workflows/edulogic.yml'
  pull_request:
    paths:
      - 'simulator/**'
      - '.github/workflows/edulogic.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python qualification
        working-directory: simulator
        run: python -m unittest -v test_edulogic.py
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Generate half-adder Verilog
        working-directory: simulator
        run: python edulogic.py examples/half-adder.json --verilog > /tmp/half-adder.v
      - name: Compare golden HDL
        run: diff -u simulator/examples/half-adder.v /tmp/half-adder.v
      - name: Compile and simulate half-adder HDL
        run: |
          iverilog -g2005 -s half_adder_tb -o /tmp/half-adder.vvp /tmp/half-adder.v simulator/examples/half-adder.tb.v
          vvp /tmp/half-adder.vvp
      - name: Compile generated counter HDL
        working-directory: simulator
        run: |
          python edulogic.py examples/counter4-control.json --verilog > /tmp/counter4.v
          iverilog -g2005 -s counter4_control -o /tmp/counter4.vvp /tmp/counter4.v
